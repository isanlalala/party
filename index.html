<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>殺紅了眼</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        /* ── Design Tokens ── */
        :root {
            --bg:        #FFFCF6;
            --border:    #3E3A39;
            --coral:     #F2A497;
            --yellow:    #F6D27A;
            --sky:       #A8D3E6;
            --green:     #B9DAA5;
            --text:      #3E3A39;
            --radius:    18px;
            --bw:        3px;
            --font:      'Huninn', 'Noto Sans TC', sans-serif;
        }

        /* ── Reset / Base ── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 30px;
        }

        /* ── Reduced Motion ── */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }

        /* ── Top Nav ── */
        #top-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg);
            border-bottom: var(--bw) solid var(--border);
            display: flex;
            align-items: center;
            gap: 0;
        }
        #top-nav .nav-logo {
            font-size: 1.3rem;
            font-weight: 700;
            padding: 10px 16px;
            border-right: var(--bw) solid var(--border);
            white-space: nowrap;
            flex-shrink: 0;
        }
        #top-nav .nav-tabs {
            display: flex;
            flex: 1;
            overflow-x: auto;
        }
        #top-nav .nav-tabs button {
            flex: 1;
            min-width: 80px;
            padding: 12px 8px;
            background: transparent;
            border: none;
            border-right: var(--bw) solid var(--border);
            font-family: var(--font);
            font-size: 1rem;
            color: var(--text);
            cursor: pointer;
            transition: background 0.15s;
            white-space: nowrap;
        }
        #top-nav .nav-tabs button:last-child { border-right: none; }
        #top-nav .nav-tabs button:hover,
        #top-nav .nav-tabs button.active { background: var(--yellow); }

        /* ── Page wrapper ── */
        .page-wrap {
            max-width: 520px;
            margin: 0 auto;
            padding: 20px 16px;
        }

        /* ── Card ── */
        .card {
            background: var(--bg);
            border: var(--bw) solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
        }

        /* ── Section title ── */
        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ── Buttons ── */
        button {
            font-family: var(--font);
            font-size: 0.95rem;
            font-weight: 700;
            border: var(--bw) solid var(--border);
            border-radius: 12px;
            padding: 10px 16px;
            cursor: pointer;
            transition: transform 0.12s, box-shadow 0.12s;
            background: var(--coral);
            color: var(--text);
        }
        button:hover { transform: translateY(-2px); box-shadow: 3px 3px 0 var(--border); }
        button:active { transform: translateY(0); box-shadow: none; }
        button.btn-yellow { background: var(--yellow); }
        button.btn-sky    { background: var(--sky); }
        button.btn-green  { background: var(--green); }
        button.btn-ghost  { background: transparent; }
        button.btn-wide   { width: 100%; }
        button.btn-big    { font-size: 1.2rem; padding: 16px 24px; }
        button.btn-win    { background: var(--green); width: 100%; margin-top: 8px; }

        /* ── Button group ── */
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 8px 0;
        }
        .btn-group button { flex: 1; min-width: 52px; }

        /* ── Inputs ── */
        input[type="text"],
        input[type="number"],
        input[type="month"] {
            font-family: var(--font);
            font-size: 0.95rem;
            border: var(--bw) solid var(--border);
            border-radius: 10px;
            padding: 8px 12px;
            background: var(--bg);
            color: var(--text);
            width: 100%;
        }
        input::placeholder { color: #999; }

        /* ── Display box ── */
        .display-box {
            background: var(--yellow);
            border: var(--bw) solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            margin-top: 12px;
            min-height: 50px;
            font-size: 1rem;
        }

        /* ── Checkbox label ── */
        .check-label {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
            cursor: pointer;
            font-size: 0.95rem;
        }
        input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--coral); }

        /* ── Bounce animation for view transitions ── */
        @keyframes bounce-in {
            0%   { transform: scale(0.88); opacity: 0; }
            60%  { transform: scale(1.04); opacity: 1; }
            80%  { transform: scale(0.97); }
            100% { transform: scale(1); }
        }
        .view:not(.hidden) { animation: bounce-in 0.35s ease; }

        /* ── Float animation for SVG illustrations ── */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(-1deg); }
            50%       { transform: translateY(-8px) rotate(1deg); }
        }
        .illus-float { animation: float 4s ease-in-out infinite; }

        /* ── Hidden ── */
        .hidden { display: none !important; }

        /* ━━━━━━━━━━━━━━━━━━━━━
           HOME (Welcome Screen)
        ━━━━━━━━━━━━━━━━━━━━━ */
        #view-home {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            padding-top: 24px;
        }
        #view-home h1 {
            font-size: 2rem;
            text-align: center;
            line-height: 1.3;
        }
        .home-illus {
            width: 200px;
            height: 200px;
        }
        .home-cta { display: flex; flex-direction: column; gap: 12px; width: 100%; }

        /* ━━━━━━━━━━━━━━━━━━━━━
           BIG TV GAME PLAY
        ━━━━━━━━━━━━━━━━━━━━━ */
        #view-bigtv-play .game-card {
            border: var(--bw) solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .game-header {
            background: var(--sky);
            border-bottom: var(--bw) solid var(--border);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 1rem;
        }
        #word-display {
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 32px 20px;
            background: var(--bg);
            transition: background 0.2s ease;
        }
        .display-word        { font-size: 3rem; font-weight: 700; line-height: 1.2; }
        .display-translation { font-size: 1.3rem; margin-top: 8px; opacity: 0.75; }
        .display-category    { font-size: 0.8rem; margin-top: 16px; opacity: 0.5; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
        .game-controls {
            display: flex;
            gap: 12px;
            padding: 14px;
            background: var(--bg);
            border-top: var(--bw) solid var(--border);
        }
        .game-controls button:first-child { flex: 1; background: var(--sky); }
        .game-controls button:last-child  { flex: 2; background: var(--green); font-size: 1.1rem; }

        /* Flash */
        .flash-green { background: var(--green) !important; }

        /* game-over */
        #game-over {
            text-align: center;
            padding: 40px 20px;
        }
        #game-over .go-title { font-size: 1.8rem; font-weight: 700; margin-bottom: 8px; }
        #game-over .go-score { font-size: 2.5rem; font-weight: 700; color: var(--coral); margin-bottom: 24px; }

        /* ── Stats table ── */
        .stats-table { width: 100%; border-collapse: collapse; }
        .stats-table th, .stats-table td {
            padding: 10px;
            border-bottom: 2px solid var(--border);
            text-align: left;
        }
        .stats-table th { font-weight: 700; background: var(--yellow); }
        .stats-table tr:last-child td { border-bottom: none; }
        .stats-block {
            border: var(--bw) solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 18px;
        }
        .stats-block-header {
            background: var(--coral);
            padding: 10px 14px;
            font-weight: 700;
            font-size: 1rem;
        }

        /* ── Category checklist box ── */
        #category-checklist {
            max-height: 160px;
            overflow-y: auto;
            border: var(--bw) solid var(--border);
            border-radius: 12px;
            padding: 10px 14px;
            background: var(--bg);
            margin-bottom: 14px;
        }

        /* ── Time selector ── */
        .time-opt { background: var(--sky); min-width: 44px; flex: 1; }
        .time-opt.active { background: var(--coral); }

        /* ── Divider ── */
        hr.deco {
            border: none;
            border-top: 2px dashed var(--border);
            margin: 14px 0;
            opacity: 0.3;
        }

        /* ── Back link ── */
        .back-link {
            background: transparent;
            border: var(--bw) solid var(--border);
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 0.9rem;
        }

        /* ── Results word table ── */
        .word-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .word-table th { padding: 8px 10px; background: var(--yellow); border-bottom: var(--bw) solid var(--border); text-align: left; position: sticky; top: 0; }
        .word-table td { padding: 8px 10px; border-bottom: 1px solid rgba(62,58,57,0.15); }

        /* ── Custom player inputs ── */
        #nameInputsArea {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        #nameInputsArea label { font-size: 0.75rem; color: #888; display: block; margin-bottom: 3px; }
    </style>
</head>
<body>

<!-- ══════════════════════════════
     TOP STICKY NAV
══════════════════════════════ -->
<nav id="top-nav">
    <div class="nav-logo">🍶⚡</div>
    <div class="nav-tabs">
        <button onclick="showView('home')" id="nav-home">首頁</button>
        <button onclick="showView('setup')" id="nav-setup">🗡️ 隊伍</button>
        <button onclick="showView('bigtv')" id="nav-bigtv">📺 大電視</button>
        <button onclick="showStatsPage()" id="nav-stats">📊 統計</button>
    </div>
</nav>

<div class="page-wrap">

    <!-- ══ HOME ══ -->
    <div id="view-home" class="view">
        <!-- SVG Illustration: two cartoon swords crossing with sparkles -->
        <svg class="home-illus illus-float" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-label="兩把劍交叉插圖">
            <!-- background circle -->
            <circle cx="100" cy="100" r="95" fill="#F6D27A" stroke="#3E3A39" stroke-width="3"/>
            <!-- left sword blade -->
            <rect x="42" y="62" width="10" height="90" rx="4" fill="#A8D3E6" stroke="#3E3A39" stroke-width="2.5" transform="rotate(-35 100 100)"/>
            <!-- left guard -->
            <rect x="58" y="118" width="26" height="10" rx="4" fill="#F2A497" stroke="#3E3A39" stroke-width="2.5" transform="rotate(-35 100 100)"/>
            <!-- left handle -->
            <rect x="62" y="126" width="8" height="24" rx="4" fill="#B9DAA5" stroke="#3E3A39" stroke-width="2.5" transform="rotate(-35 100 100)"/>
            <!-- right sword blade -->
            <rect x="42" y="62" width="10" height="90" rx="4" fill="#A8D3E6" stroke="#3E3A39" stroke-width="2.5" transform="rotate(35 100 100) scale(-1,1) translate(-200,0)"/>
            <!-- right guard -->
            <rect x="58" y="118" width="26" height="10" rx="4" fill="#F2A497" stroke="#3E3A39" stroke-width="2.5" transform="rotate(35 100 100) scale(-1,1) translate(-200,0)"/>
            <!-- right handle -->
            <rect x="62" y="126" width="8" height="24" rx="4" fill="#B9DAA5" stroke="#3E3A39" stroke-width="2.5" transform="rotate(35 100 100) scale(-1,1) translate(-200,0)"/>
            <!-- sparkles -->
            <text x="90" y="72" font-size="18" text-anchor="middle">✨</text>
            <text x="112" y="88" font-size="14" text-anchor="middle">⭐</text>
            <text x="82" y="92" font-size="12" text-anchor="middle">💫</text>
        </svg>

        <h1>殺紅了眼 🍶🪓</h1>
        <p style="text-align:center;opacity:0.6;font-size:0.95rem;">朋友聚會遊戲小工具</p>

        <div class="home-cta">
            <button class="btn-big btn-yellow btn-wide" onclick="showView('setup')">🗡️ 組隊 & 座位</button>
            <button class="btn-big btn-sky btn-wide" onclick="showView('bigtv')">📺 大電視猜字</button>
            <button class="btn-big btn-wide" onclick="showStatsPage()" style="background:var(--green)">📊 查看統計</button>
        </div>
    </div>

    <!-- ══ TEAM & SEAT ══ -->
    <div id="view-setup" class="view hidden">

        <!-- Seat Draw -->
        <div class="card">
            <!-- SVG: chairs illustration -->
            <svg width="64" height="48" viewBox="0 0 64 48" xmlns="http://www.w3.org/2000/svg" style="display:block;margin-bottom:8px">
                <rect x="4" y="16" width="20" height="14" rx="4" fill="#F6D27A" stroke="#3E3A39" stroke-width="2.5"/>
                <rect x="8" y="30" width="4" height="10" rx="2" fill="#B9DAA5" stroke="#3E3A39" stroke-width="2"/>
                <rect x="16" y="30" width="4" height="10" rx="2" fill="#B9DAA5" stroke="#3E3A39" stroke-width="2"/>
                <rect x="4" y="10" width="20" height="8" rx="3" fill="#F2A497" stroke="#3E3A39" stroke-width="2.5"/>
                <rect x="40" y="16" width="20" height="14" rx="4" fill="#F6D27A" stroke="#3E3A39" stroke-width="2.5"/>
                <rect x="44" y="30" width="4" height="10" rx="2" fill="#B9DAA5" stroke="#3E3A39" stroke-width="2"/>
                <rect x="52" y="30" width="4" height="10" rx="2" fill="#B9DAA5" stroke="#3E3A39" stroke-width="2"/>
                <rect x="40" y="10" width="20" height="8" rx="3" fill="#F2A497" stroke="#3E3A39" stroke-width="2.5"/>
            </svg>
            <div class="section-title">🪑 快速抽座位</div>
            <div class="btn-group">
                <button class="btn-yellow" onclick="initSeatDraw(3)">3人</button>
                <button class="btn-yellow" onclick="initSeatDraw(4)">4人</button>
                <button class="btn-yellow" onclick="initSeatDraw(5)">5人</button>
                <button class="btn-yellow" onclick="initSeatDraw(6)">6人</button>
                <button class="btn-yellow" onclick="initSeatDraw(7)">7人</button>
                <button class="btn-yellow" onclick="initSeatDraw(8)">8人</button>
            </div>
            <div style="display:flex;gap:8px;align-items:center;margin-top:10px;">
                <input type="number" id="custom-players" min="2" max="20" placeholder="人數" style="width:90px;">
                <button class="btn-yellow" onclick="initSeatDraw(parseInt(document.getElementById('custom-players').value)||5)" style="flex:1">自訂</button>
            </div>
            <div id="seatActionArea" class="hidden" style="text-align:center;margin-top:14px;">
                <button id="drawBtn" onclick="drawNextSeat()" class="btn-wide btn-coral" style="background:var(--coral)">抽我的座位！</button>
                <div class="display-box" id="seatDisplay">請先選擇人數</div>
            </div>
        </div>

        <!-- Team Assignment -->
        <div class="card">
            <!-- SVG: two teams flags -->
            <svg width="64" height="48" viewBox="0 0 64 48" xmlns="http://www.w3.org/2000/svg" style="display:block;margin-bottom:8px">
                <rect x="6" y="4" width="4" height="36" rx="2" fill="#3E3A39"/>
                <path d="M10 4 L30 10 L10 20 Z" fill="#F2A497" stroke="#3E3A39" stroke-width="2"/>
                <rect x="54" y="4" width="4" height="36" rx="2" fill="#3E3A39"/>
                <path d="M54 4 L34 10 L54 20 Z" fill="#A8D3E6" stroke="#3E3A39" stroke-width="2"/>
            </svg>
            <div class="section-title">⚔️ 隨機分隊</div>
            <label class="check-label" style="margin-bottom:10px;">
                <input type="checkbox" id="useDefault" checked onchange="togglePlayerInputs()">
                使用預設成員（I San、Ricky、Angela、Lawrence、Suzanne）
            </label>
            <div id="customPlayerSetup" class="hidden" style="margin-top:12px;padding:14px;background:var(--yellow);border:var(--bw) solid var(--border);border-radius:14px;">
                <label style="font-weight:700;font-size:0.9rem;">幾位玩家？</label>
                <input type="number" id="playerCount" value="5" min="2" max="20" onchange="generateNameInputs()" style="width:70px;margin-left:8px;">
                <div id="nameInputsArea"></div>
            </div>
            <button onclick="assignTeams()" class="btn-wide btn-big" style="margin-top:14px;background:var(--coral)">分隊 + 抽位</button>
            <div id="teamResult" class="display-box hidden" style="margin-top:12px;line-height:1.8;"></div>
            <div id="winButtons" class="hidden" style="margin-top:10px;">
                <button class="btn-win" onclick="recordWin(1)">🏆 隊伍一 贏！</button>
                <button class="btn-win" onclick="recordWin(2)">🏆 隊伍二 贏！</button>
            </div>
        </div>
    </div>

    <!-- ══ BIG TV LOBBY ══ -->
    <div id="view-bigtv" class="view hidden">
        <div class="card">
            <!-- SVG: TV illustration -->
            <svg width="80" height="64" viewBox="0 0 80 64" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:0 auto 12px;animation:float 4s ease-in-out infinite" aria-label="電視插圖">
                <rect x="4" y="8" width="72" height="44" rx="8" fill="#A8D3E6" stroke="#3E3A39" stroke-width="3"/>
                <rect x="12" y="14" width="56" height="32" rx="4" fill="#FFFCF6" stroke="#3E3A39" stroke-width="2"/>
                <rect x="30" y="52" width="20" height="8" rx="2" fill="#F6D27A" stroke="#3E3A39" stroke-width="2"/>
                <circle cx="58" cy="30" r="4" fill="#F2A497" stroke="#3E3A39" stroke-width="1.5"/>
                <circle cx="66" cy="30" r="4" fill="#B9DAA5" stroke="#3E3A39" stroke-width="1.5"/>
                <!-- screen text lines -->
                <rect x="18" y="22" width="30" height="4" rx="2" fill="#F6D27A"/>
                <rect x="18" y="30" width="22" height="3" rx="1.5" fill="#F2A497" opacity="0.7"/>
                <rect x="18" y="37" width="26" height="3" rx="1.5" fill="#B9DAA5" opacity="0.7"/>
            </svg>
            <div class="section-title">📺 大電視猜字</div>

            <label style="font-weight:700;font-size:0.9rem;display:block;margin-bottom:6px;">📁 選擇類別：</label>
            <div id="category-checklist">
                <label class="check-label" style="font-weight:700;border-bottom:1px dashed #ccc;padding-bottom:6px;margin-bottom:6px;">
                    <input type="checkbox" id="check-all" onchange="toggleAllCats(this.checked)" checked>（全選）
                </label>
                <div id="category-items"></div>
            </div>

            <label style="font-weight:700;font-size:0.9rem;display:block;margin-bottom:6px;">⏱️ 遊戲時間：</label>
            <div class="btn-group">
                <button class="time-opt" onclick="setTime(10)"  id="t10">10s</button>
                <button class="time-opt" onclick="setTime(90)"  id="t90">90s</button>
                <button class="time-opt" onclick="setTime(120)" id="t120">120s</button>
                <button class="time-opt" onclick="setTime(180)" id="t180">180s</button>
                <button class="time-opt" onclick="setTime(300)" id="t300">300s</button>
                <button class="time-opt" onclick="setTime(600)" id="t600">600s</button>
            </div>
            <div style="display:flex;gap:8px;align-items:center;margin-top:10px;">
                <input type="number" id="custom-time" min="5" max="3600" placeholder="自訂秒數" style="flex:1">
                <button class="btn-sky" onclick="setTime(parseInt(document.getElementById('custom-time').value)||60)" style="white-space:nowrap">設定</button>
            </div>

            <hr class="deco">
            <button onclick="startBigTV()" class="btn-wide btn-big" style="background:var(--coral);margin-top:4px;">▶ 開始遊戲</button>
        </div>
    </div>

    <!-- ══ BIG TV PLAY ══ -->
    <div id="view-bigtv-play" class="view hidden">
        <div id="game-active">
            <div id="game-playing">
                <div class="game-header">
                    <span>⏱️ <span id="timer">60</span>s</span>
                    <span>分數：<span id="score">0</span></span>
                    <button class="back-link" onclick="endGame(true)" style="background:var(--coral);font-size:0.85rem;">停止</button>
                </div>
                <div id="word-display"><div class="display-word">載入中…</div></div>
                <div class="game-controls">
                    <button onclick="nextWord(false)">跳過 ⊘</button>
                    <button onclick="nextWord(true)">答對 ✅</button>
                </div>
            </div>

            <div id="game-over" class="hidden card" style="margin-top:20px;">
                <div class="go-title">🎮 遊戲結束！</div>
                <div class="go-score">最終得分：<span id="final-score">0</span></div>
                <div style="display:flex;flex-direction:column;gap:10px;">
                    <button class="btn-yellow btn-wide" onclick="showGameResults()">📋 查看詳細結果</button>
                    <button class="btn-sky btn-wide" onclick="exitBigTV()">← 返回選單</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ══ STATS ══ -->
    <div id="view-stats" class="view hidden">
        <div class="card">
            <div class="section-title">📊 統計 & 歷史</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
                <button class="btn-yellow" onclick="loadStatsForMonth(null)" style="flex:1">全部</button>
                <input type="month" id="month-picker" style="flex:1;" onchange="loadStatsForMonth(document.getElementById('month-picker').value)">
            </div>
            <button class="btn-ghost btn-wide" onclick="resetDateFilter()" style="margin-bottom:14px;font-size:0.85rem;">清除篩選</button>
            <div id="statsContent" style="min-height:200px;">
                <p style="text-align:center;opacity:0.5;padding:20px;">⌛ 載入中…</p>
            </div>
        </div>
    </div>

    <!-- ══ GAME RESULTS ══ -->
    <div id="view-game-results" class="view hidden">
        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
                <div class="section-title" style="margin-bottom:0">📋 遊戲結果</div>
                <button class="back-link" onclick="showView('setup')">← 回主選單</button>
            </div>
            <div id="game-summary" class="display-box" style="margin-bottom:14px;">載入中…</div>
            <div id="game-words-list" style="overflow-x:auto;max-height:60vh;overflow-y:auto;border:var(--bw) solid var(--border);border-radius:14px;">
                <p style="padding:20px;text-align:center;opacity:0.5;">尚無遊戲紀錄</p>
            </div>
        </div>
    </div>

</div><!-- /page-wrap -->

<script>
    // --- 0. FIREBASE CONFIG ---
    const firebaseConfig = {
        apiKey: "AIzaSyB3BhgYIyDCTHsF6ZXU1Y35BAhWDGJgwF4",
        authDomain: "party-8c722.firebaseapp.com",
        projectId: "party-8c722",
        storageBucket: "party-8c722.firebasestorage.app",
        messagingSenderId: "848163286246",
        appId: "1:848163286246:web:d7f811ee2664dacfcf9f27",
        measurementId: "G-V7WJLYJT70"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // --- NAVIGATION ---
    const NAV_IDS = { home:'nav-home', setup:'nav-setup', bigtv:'nav-bigtv', stats:'nav-stats' };

    window.showView = function(viewName) {
        document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
        const el = document.getElementById('view-' + viewName);
        if (el) el.classList.remove('hidden');
        // highlight active nav tab
        Object.values(NAV_IDS).forEach(id => document.getElementById(id)?.classList.remove('active'));
        if (NAV_IDS[viewName]) document.getElementById(NAV_IDS[viewName])?.classList.add('active');
    };

    // --- MODE HELPERS ---
    window.exitBigTVMode = function() {
        clearInterval(gameInterval);
        showView('home');
        document.getElementById('game-playing').style.display = 'flex';
        document.getElementById('game-over').classList.add('hidden');
    };

    window.exitBigTV = function() {
        clearInterval(gameInterval);
        document.getElementById('game-playing').style.display = 'flex';
        document.getElementById('game-over').classList.add('hidden');
        showView('bigtv');
    };

    // --- STATS ---
    let allStatsData = [];

    window.showStatsPage = function() {
        showView('stats');
        document.getElementById('nav-stats')?.classList.add('active');
        setTimeout(() => loadAllStats(), 100);
    };

    window.loadAllStats = async function() {
        const contentArea = document.getElementById('statsContent');
        contentArea.innerHTML = "<p style='text-align:center;padding:20px;'>⌛ 載入中…</p>";
        try {
            const timeoutP = new Promise((_,rej) => setTimeout(()=>rej(new Error("逾時")), 10000));
            const snap = await Promise.race([db.collection("daily_stats").get(), timeoutP]);
            allStatsData = [];
            snap.forEach(doc => allStatsData.push({ id: doc.id, data: doc.data() }));
            allStatsData.sort((a,b) => b.id.localeCompare(a.id));
            displayStats(allStatsData, false);
            document.getElementById('month-picker').value = '';
        } catch(e) {
            contentArea.innerHTML = `<p style='text-align:center;color:#c00;padding:20px;'>錯誤：${e.message}</p>`;
        }
    };

    window.loadStatsForMonth = function(monthStr) {
        if (!monthStr) { loadAllStats(); return; }
        const filtered = allStatsData.filter(item => item.id.startsWith(monthStr));
        if (!filtered.length) {
            document.getElementById('statsContent').innerHTML = `<p style='text-align:center;padding:20px;'>${monthStr} 尚無紀錄</p>`;
        } else {
            displayStats(filtered, true);
        }
    };

    window.resetDateFilter = function() {
        document.getElementById('month-picker').value = '';
        loadAllStats();
    };

    function displayStats(statsArray, showDaily=false) {
        if (!statsArray.length) {
            document.getElementById('statsContent').innerHTML = "<p style='text-align:center;padding:20px;'>尚無對局紀錄。</p>";
            return;
        }
        const overall = {};
        statsArray.forEach(item => {
            for (const pName in item.data) {
                const s = item.data[pName];
                const k = pName.toLowerCase();
                if (!overall[k]) overall[k] = { displayName: pName, wins:0, total:0 };
                overall[k].wins  += s.wins  || 0;
                overall[k].total += s.total || 0;
            }
        });

        const maxRate = Math.max(...Object.values(overall).map(p => p.total > 0 ? p.wins/p.total : 0));
        const sortedPlayers = Object.values(overall).sort((a,b) => b.total - a.total);

        let rows = sortedPlayers.map(p => {
            const r = p.total > 0 ? p.wins/p.total : 0;
            const pct = Math.round(r*100);
            const crown = (r === maxRate && p.wins > 0) ? ' 👑' : '';
            const color = pct >= 60 ? '#4a9e4f' : (pct <= 40 && p.total > 0 ? '#c05050' : '#666');
            return `<tr><td><strong>${p.displayName.toUpperCase()}${crown}</strong></td><td style="color:${color};font-weight:700">${pct}%</td><td>${p.wins}勝 - ${p.total-p.wins}敗</td></tr>`;
        }).join('');

        let html = `<div class="stats-block">
            <div class="stats-block-header">🏆 總體統計</div>
            <table class="stats-table"><thead><tr><th>玩家</th><th>勝率</th><th>勝/敗</th></tr></thead><tbody>${rows}</tbody></table>
        </div>`;

        if (showDaily) {
            [...statsArray].sort((a,b)=>b.id.localeCompare(a.id)).forEach(item => {
                const maxR = Math.max(...Object.values(item.data).map(s => s.total>0?s.wins/s.total:0));
                let drows = '';
                for (const pName in item.data) {
                    const s = item.data[pName];
                    const r = s.total>0?s.wins/s.total:0;
                    const pct = Math.round(r*100);
                    const crown = (r===maxR && s.wins>0)?' 👑':'';
                    const color = pct>=60?'#4a9e4f':(pct<=40&&s.total>0?'#c05050':'#666');
                    drows += `<tr><td><strong>${pName.toUpperCase()}${crown}</strong></td><td style="color:${color};font-weight:700">${pct}%</td><td>${s.wins}勝 - ${(s.total||0)-(s.wins||0)}敗</td></tr>`;
                }
                html += `<div class="stats-block">
                    <div class="stats-block-header" style="background:var(--sky)">📅 ${item.id}</div>
                    <table class="stats-table"><thead><tr><th>玩家</th><th>勝率</th><th>勝/敗</th></tr></thead><tbody>${drows}</tbody></table>
                </div>`;
            });
        }
        document.getElementById('statsContent').innerHTML = html;
    }

    // --- 1. GLOBAL STATE ---
    let availableSeats = [];
    let totalSeatsSet = 0;
    let confirmedCount = 0;
    const defaultPlayers = ["I San🍭","Ricky🐹","Angela","Lawrence","Suzanne"];
    let currentTeams = { team1:[], team2:[] };

    // --- 2. SEAT DRAW ---
    window.initSeatDraw = function(num) {
        if (!num || num < 1) return;
        totalSeatsSet = parseInt(num);
        confirmedCount = 0;
        availableSeats = Array.from({length:totalSeatsSet},(_,i)=>i+1).sort(()=>Math.random()-0.5);
        document.getElementById('seatActionArea').classList.remove('hidden');
        document.getElementById('seatDisplay').innerText = `準備好為 ${num} 人抽座位了！`;
        document.getElementById('drawBtn').disabled = false;
    };

    window.drawNextSeat = function() {
        if (availableSeats.length > 0) {
            const seat = availableSeats.pop();
            confirmedCount++;
            document.getElementById('seatDisplay').innerHTML = `<strong>你的座位：第 ${seat} 號</strong><br>已確認：${confirmedCount}/${totalSeatsSet}`;
            if (!availableSeats.length) document.getElementById('drawBtn').disabled = true;
        }
    };

    // --- 3. TEAM ASSIGNMENT ---
    window.togglePlayerInputs = function() {
        const isDefault = document.getElementById('useDefault').checked;
        document.getElementById('customPlayerSetup').classList.toggle('hidden', isDefault);
        if (!isDefault) generateNameInputs();
    };

    window.generateNameInputs = function() {
        const count = parseInt(document.getElementById('playerCount').value) || 5;
        const area = document.getElementById('nameInputsArea');
        area.innerHTML = '';
        const defaults = ["I San","Ricky","Angela","Lawrence","Suzanne"];
        for (let i=1; i<=count; i++) {
            area.innerHTML += `<div><label>玩家 ${i}</label><input type="text" class="player-name-input" value="${defaults[i-1]||''}" placeholder="名字…"></div>`;
        }
    };

    window.assignTeams = function() {
        let players = [];
        if (document.getElementById('useDefault').checked) {
            players = [...defaultPlayers];
        } else {
            document.querySelectorAll('.player-name-input').forEach(inp => {
                if (inp.value.trim()) players.push(inp.value.trim());
            });
            if (players.length < 2) { alert("請至少輸入 2 位玩家！"); return; }
        }
        players.sort(()=>Math.random()-0.5);
        const seats = Array.from({length:players.length},(_,i)=>i+1).sort(()=>Math.random()-0.5);
        const mid = Math.ceil(players.length/2);
        currentTeams.team1 = players.slice(0,mid).map(p=>({name:p,seat:seats.pop()}));
        currentTeams.team2 = players.slice(mid).map(p=>({name:p,seat:seats.pop()}));
        let html = `<strong>隊伍一：</strong>${currentTeams.team1.map(p=>`${p.name}(${p.seat})`).join('、')}<br>`;
        html += `<strong>隊伍二：</strong>${currentTeams.team2.map(p=>`${p.name}(${p.seat})`).join('、')}`;
        document.getElementById('teamResult').innerHTML = html;
        document.getElementById('teamResult').classList.remove('hidden');
        document.getElementById('winButtons').classList.remove('hidden');
    };

    // --- 4. WIN RECORDING ---
    function getTodayString() {
        const d = new Date();
        return `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')}`;
    }

    window.recordWin = async function(winTeam) {
        try {
            const dateKey = getTodayString();
            const winners = winTeam===1 ? currentTeams.team1 : currentTeams.team2;
            const all = [...currentTeams.team1, ...currentTeams.team2];
            const ref = db.collection("daily_stats").doc(dateKey);
            const doc = await ref.get();
            let data = doc.exists ? doc.data() : {};
            all.forEach(p => {
                const k = p.name.toLowerCase();
                if (!data[k]) data[k] = { wins:0, total:0 };
                data[k].total += 1;
                if (winners.some(w=>w.name===p.name)) data[k].wins += 1;
            });
            await ref.set(data);
            alert(`${dateKey} 的對局已記錄！`);
        } catch(e) { console.error("Save error:", e); }
    };

    // --- GAME RESULTS ---
    window.showGameResults = function() {
        if (!lastGameResults) { alert("還沒有遊戲結果！先玩一局吧。"); return; }
        showView('game-results');
        displayGameResults();
    };

    window.displayGameResults = function() {
        if (!lastGameResults) {
            document.getElementById('game-summary').innerHTML = "尚無結果";
            document.getElementById('game-words-list').innerHTML = "<p style='padding:20px;text-align:center'>尚無遊戲紀錄</p>";
            return;
        }
        try {
            const { score, duration, totalWords, correctCount, skippedCount, words } = lastGameResults;
            document.getElementById('game-summary').innerHTML = `得分：<strong>${score}</strong> ｜ 答對：<strong style="color:#4a9e4f">${correctCount}/${totalWords}</strong> ｜ 跳過：<strong>${skippedCount}</strong> ｜ 時間：<strong>${duration}s</strong>`;
            let t = `<table class="word-table"><thead><tr><th>#</th><th>字</th><th>翻譯</th><th>結果</th><th>類別</th></tr></thead><tbody>`;
            if (words?.length) {
                words.forEach(w => {
                    const ok = w.result==='correct';
                    t += `<tr><td>${w.order}</td><td><strong>${w.word}</strong></td><td>${w.translation}</td><td style="color:${ok?'#4a9e4f':'#c05050'};font-weight:700">${ok?'✅ 答對':'⊘ 跳過'}</td><td style="opacity:0.6;font-size:0.85rem">${w.category}</td></tr>`;
                });
            } else { t += `<tr><td colspan="5" style="padding:20px;text-align:center">無字詞</td></tr>`; }
            t += `</tbody></table>`;
            document.getElementById('game-words-list').innerHTML = t;
        } catch(e) { document.getElementById('game-words-list').innerHTML = `<p style='color:red;padding:20px'>錯誤：${e.message}</p>`; }
    };

    // --- 6. BIG TV ENGINE ---
    let gameWords = [];
    let filteredWords = [];
    let shownWordsInRound = [];
    let gameScore = 0;
    let timeLeft = 60;
    let gameInterval;
    let selectedDuration = 60;
    let gameHistory = [];
    let currentWordItem = null;
    let lastGameResults = null;

    window.setTime = function(seconds) {
        selectedDuration = seconds;
        document.querySelectorAll('.time-opt').forEach(btn => btn.classList.remove('active'));
        const btn = document.getElementById('t' + seconds);
        if (btn) btn.classList.add('active');
        document.getElementById('custom-time').value = '';
    };

    async function loadWords() {
        const orig = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRzCZ1TCzstZPFtem7rrT6ZHZM4SXZdeI6r5SJTz32issZ5ZCLiNN9l2PE-MSqVErhyNN0EZxeVud3H/pub?gid=1360810286&single=true&output=csv';
        const url = 'https://corsproxy.io/?' + encodeURIComponent(orig);
        try {
            const res = await fetch(url);
            const text = await res.text();
            const lines = text.split(/\r?\n/).filter(l=>l.trim());
            gameWords = lines.slice(1).map(l => {
                const p = l.split(',');
                return { category: p[0]?.trim()||"General", word: p[1]?.trim()||"", translation: p[2]?.trim()||"" };
            }).filter(i=>i.word);
            const container = document.getElementById('category-items');
            container.innerHTML = '';
            [...new Set(gameWords.map(i=>i.category))].sort().forEach(cat => {
                const lbl = document.createElement('label');
                lbl.className = 'check-label';
                lbl.innerHTML = `<input type="checkbox" class="cat-check" value="${cat}" checked>${cat}`;
                container.appendChild(lbl);
            });
        } catch(e) { console.error("Load failed", e); }
    }

    window.startBigTV = async function() {
        if (!gameWords.length) await loadWords();
        const selectedCats = Array.from(document.querySelectorAll('.cat-check:checked')).map(cb=>cb.value);
        if (!selectedCats.length) { alert("請至少選一個類別！"); return; }
        filteredWords = gameWords.filter(w=>selectedCats.includes(w.category));
        if (!filteredWords.length) { alert("此類別沒有字詞！"); return; }
        showView('bigtv-play');
        gameScore=0; timeLeft=selectedDuration; shownWordsInRound=[]; gameHistory=[];
        document.getElementById('score').innerText = 0;
        document.getElementById('timer').innerText = timeLeft;
        document.getElementById('game-playing').style.display = 'flex';
        document.getElementById('game-over').classList.add('hidden');
        updateWord();
        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) endGame();
        }, 1000);
    };

    window.updateWord = function() {
        const avail = filteredWords.filter(w=>!shownWordsInRound.includes(w.word));
        if (!avail.length) { shownWordsInRound=[]; return updateWord(); }
        const item = avail[Math.floor(Math.random()*avail.length)];
        currentWordItem = item;
        shownWordsInRound.push(item.word);
        document.getElementById('word-display').innerHTML = `
            <div class="display-word">${item.word}</div>
            <div class="display-translation">${item.translation||''}</div>
            <div class="display-category">${item.category||''}</div>`;
    };

    window.nextWord = function(isCorrect) {
        if (currentWordItem) {
            gameHistory.push({ word:currentWordItem.word, category:currentWordItem.category, translation:currentWordItem.translation, result:isCorrect?'correct':'skipped', order:gameHistory.length+1 });
        }
        const display = document.getElementById('word-display');
        if (isCorrect) {
            gameScore++;
            document.getElementById('score').innerText = gameScore;
            display.classList.add('flash-green');
            setTimeout(()=>display.classList.remove('flash-green'), 300);
        }
        updateWord();
    };

    window.endGame = function(manual=false) {
        clearInterval(gameInterval);
        if (manual) {
            if (!confirm("確定要提前結束遊戲嗎？")) {
                gameInterval = setInterval(()=>{ timeLeft--; document.getElementById('timer').innerText=timeLeft; if(timeLeft<=0)endGame(); },1000);
                return;
            }
        }
        lastGameResults = { score:gameScore, duration:selectedDuration-timeLeft, totalWords:gameHistory.length, correctCount:gameHistory.filter(w=>w.result==='correct').length, skippedCount:gameHistory.filter(w=>w.result==='skipped').length, words:[...gameHistory] };
        document.getElementById('game-playing').style.display = 'none';
        document.getElementById('game-over').classList.remove('hidden');
        document.getElementById('final-score').innerText = gameScore;
    };

    window.toggleAllCats = function(checked) {
        document.querySelectorAll('.cat-check').forEach(cb=>cb.checked=checked);
    };

    // --- INIT ---
    window.addEventListener('load', () => {
        loadWords().catch(e=>console.error("Initial load failed",e));
        showView('home');
    });
</script>
</body>
</html>
